<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>返礼品タスクマネージャー</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="logo">返</div>
        <div class="brand-name">返礼品タスクマネージャー</div>
      </div>

      <nav class="nav">
        <a href="#home" class="navlink" data-nav="home">ホーム</a>
        <a href="#tasks" class="navlink" data-nav="tasks">タスク管理</a>
        <a href="#campaigns" class="navlink" data-nav="campaigns">企画作成</a>
      </nav>

      <div class="actions">
        <button id="exportBtn" class="btn ghost" type="button">バックアップ</button>
        <label class="btn ghost filebtn">
          復元
          <input id="importFile" type="file" accept="application/json" hidden />
        </label>
      </div>
    </div>
  </header>

  <!-- ===== HOME ===== -->
  <main id="view-home" class="wrap stack">
    <section class="hero">
      <div class="hero-title">やりたいことを選ぶ</div>

      <div class="choice-grid">
        <a class="choice-card" href="#tasks">
          <div class="choice-icon">✅</div>
          <div class="choice-main">タスク管理</div>
        </a>
        <a class="choice-card" href="#campaigns">
          <div class="choice-icon">📌</div>
          <div class="choice-main">企画作成</div>
        </a>
      </div>
    </section>

    <section class="grid2">
      <section class="card">
        <div class="card-head">
          <div class="card-title">状況</div>
          <div class="pill" id="overallPill">—</div>
        </div>
        <div class="stats">
          <a class="stat statLink" href="#tasks?list=all">
            <div class="stat-num" id="statCampaigns">0</div>
            <div class="stat-label">企画</div>
          </a>
          <a class="stat statLink" href="#tasks?list=open">
            <div class="stat-num" id="statOpenCampaigns">0</div>
            <div class="stat-label">未完了</div>
          </a>
          <a class="stat statLink" href="#tasks?list=done">
            <div class="stat-num" id="statDoneCampaigns">0</div>
            <div class="stat-label">完了</div>
          </a>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="card-title">注意</div>
        </div>
        <div class="muted">
          ・保存先はこのブラウザ（localStorage）です。端末/ブラウザを変えると同期されません。<br/>
          ・定期的に「バックアップ」推奨。
        </div>
      </section>
    </section>
  </main>

  <!-- ===== TASKS ===== -->
  <main id="view-tasks" class="wrap stack hidden">
    <section class="pagehead">
      <div class="h1">タスク管理</div>
    </section>

    <section class="row gap wrapBtns">
      <button class="btn ghost small" id="filterAllCampaigns">すべて</button>
      <button class="btn ghost small" id="filterOpenCampaigns">未完了</button>
      <button class="btn ghost small" id="filterDoneCampaigns">完了</button>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="card-title">企画一覧</div>
      </div>
      <div id="taskCampaignList" class="list"></div>
    </section>
  </main>

  <!-- ===== CAMPAIGNS ===== -->
  <main id="view-campaigns" class="wrap stack hidden">
    <section class="pagehead">
      <div class="h1">企画作成</div>
      <div class="row gap">
        <input id="campaignSearch" class="input" placeholder="企画名で検索" />
      </div>
    </section>

    <section class="grid2">
      <section class="card">
        <div class="card-head">
          <div class="card-title">企画一覧</div>
        </div>
        <div id="campaignList" class="list"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="card-title">新規企画</div>
        </div>

        <form id="createCampaignForm" class="stack">
          <label class="field">
            <span>企画名</span>
            <input class="input" name="name" required />
          </label>

          <label class="field">
            <span>開始日</span>
            <input class="input" type="date" name="start_date" required />
          </label>

          <label class="field">
            <span>方式</span>
            <select class="input" name="type" id="createTypeSelect">
              <option value="achievement">達成型</option>
              <option value="shopping">お買い物方式</option>
              <option value="gacha">ガチャ</option>
            </select>
          </label>

          <section id="createRulesSection" class="stack">
            <div class="ruleHead">
              <div class="card-title">返礼品</div>
              <button id="addRuleRowBtn" type="button" class="btn ghost">＋行を追加</button>
            </div>
            <div id="rulesBox" class="rulesBox"></div>
          </section>

          <section id="createGachaSection" class="stack hidden">
            <div class="grid2">
              <label class="field">
                <span>1回の必要pt</span>
                <input class="input" type="number" min="1" step="1" name="g_singleCost" placeholder="例：300" />
              </label>
              <label class="field">
                <span>何ptで何連（pt）</span>
                <input class="input" type="number" min="1" step="1" name="g_multiCost" placeholder="例：3000" />
              </label>
            </div>

            <div class="grid2">
              <label class="field">
                <span>何ptで何連（連数）</span>
                <input class="input" type="number" min="1" step="1" name="g_multiCount" placeholder="例：10" />
              </label>
              <div></div>
            </div>

            <div class="ruleHead">
              <div class="card-title">景品（出現率%）</div>
              <button id="addGachaRowBtn" type="button" class="btn ghost">＋行を追加</button>
            </div>
            <div id="gachaItemsBox" class="rulesBox"></div>
          </section>

          <button class="btn primary" type="submit">企画を作成</button>
        </form>
      </section>
    </section>
  </main>

  <!-- ===== CAMPAIGN (返礼品状況一覧) ===== -->
  <main id="view-campaign" class="wrap stack hidden">
    <section class="pagehead">
      <div>
        <div class="row gap wrapBtns">
          <a class="btn ghost" href="#tasks">←</a>
          <a class="btn ghost" href="#campaigns">企画作成</a>
          <div class="pill" id="campaignStatusPill">—</div>
        </div>
        <div class="h1" id="campaignTitle"></div>
        <div class="muted" id="campaignMeta"></div>
      </div>

      <div class="row gap wrapBtns">
        <a id="goLiveBtn" class="btn ghost" href="#live=">リアルタイム編集</a>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="card-title">返礼品状況</div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>名前</th>
            <th class="right">合計pt</th>
            <th class="center">返礼品</th>
            <th>状況</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </section>
  </main>

  <!-- ===== LIVE ===== -->
  <main id="view-live" class="wrap stack hidden">
    <section class="pagehead">
      <div>
        <div class="row gap wrapBtns">
          <a class="btn ghost" href="#tasks">←</a>
          <a id="goConfirmBtn" class="btn ghost" href="#campaign=">返礼品状況一覧</a>
          <div class="pill">リアルタイム編集</div>
        </div>
        <div class="h1" id="liveTitle"></div>
        <div class="muted" id="liveMeta"></div>
      </div>
    </section>

    <!-- ガチャ企画だけ表示 -->
    <section id="liveGachaCard" class="card hidden">
      <div class="card-head">
        <div class="card-title">ガチャ</div>
      </div>

      <div class="grid2">
        <label class="field">
          <span>回した人</span>
          <select id="gachaUserSelect" class="input"></select>
        </label>
        <label class="field">
          <span>使用pt</span>
          <input id="gachaPtInput" class="input" type="number" min="0" step="1" placeholder="例：3000" />
        </label>
      </div>

      <div class="row gap wrapBtns">
        <button id="gachaRollBtn" class="btn primary" type="button">回す</button>
        <button id="gachaCopyBtn" class="btn ghost" type="button">コピー</button>
      </div>

      <textarea id="gachaResultBox" class="textarea" rows="8" readonly></textarea>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="card-title">返礼品一覧</div>
      </div>
      <div id="rewardListBox" class="rewardList"></div>
    </section>

    <section class="grid2 top">
      <section class="card">
        <div class="card-head">
          <div class="card-title">返礼品状況</div>
        </div>

        <!-- ✅リアルタイムは“見るだけ”。編集/削除ボタンは出ない -->
        <table class="table">
          <thead>
            <tr>
              <th>名前</th>
              <th class="right">合計pt</th>
              <th class="center">返礼品</th>
            </tr>
          </thead>
          <tbody id="liveLeaderboardBody"></tbody>
        </table>
      </section>

      <!-- ガチャ企画以外だけ表示 -->
      <section id="liveInputCard" class="card">
        <div class="card-head">
          <div class="card-title">ライブ入力</div>
        </div>

        <div class="stack">
          <label class="field">
            <span>リスナー</span>
            <select id="listenerSelect" class="input"></select>
          </label>

          <label class="field">
            <span>新しい名前</span>
            <input id="listenerNewName" class="input" placeholder="表示名（入力→自動追加→空になる）" />
          </label>

          <div class="row wrapBtns">
            <button class="btn" type="button" data-add="100">+100</button>
            <button class="btn" type="button" data-add="300">+300</button>
            <button class="btn" type="button" data-add="500">+500</button>
            <button class="btn" type="button" data-add="1000">+1000</button>
            <button class="btn" type="button" data-add="5000">+5000</button>
            <button class="btn" type="button" data-add="10000">+10000</button>
            <button class="btn" type="button" data-add="30000">+30000</button>
          </div>

          <div class="row gap">
            <input id="customPoints" class="input" type="number" placeholder="任意pt（加算 or 減算）" />
            <button id="addCustomBtn" class="btn primary" type="button">加算</button>
          </div>

          <div class="row gap wrapBtns">
            <button id="undoBtn" class="btn ghost" type="button">ひとつもどる</button>
            <button id="subtractBtn" class="btn ghost" type="button">任意の減算</button>
          </div>

          <div id="liveMsg" class="muted"></div>
        </div>
      </section>
    </section>
  </main>

  <div id="jsStatus" class="jsStatus">JS: ...</div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
